<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Антон Возрожденный — Прокат автомобилей в Ялте</title>
<style>
  :root{
    --bg:#0a0a0a;
    --lime:#c6ff1e;
    --lime-soft:#a4e600;
    --text:#f2f2f2;
    --muted:#9a9a9a;
    --card:#121212;
    --border:#232323;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    background:
      radial-gradient(circle at 20% 15%, rgba(198,255,30,0.08), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(198,255,30,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, var(--card) 0%, #0e0e0e 100%);
    border:1px solid var(--border);
    border-radius:24px;
    padding:40px 32px 32px;
    box-shadow:
      0 0 0 1px rgba(198,255,30,0.03),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(198,255,30,0.04);
    overflow:hidden;
    animation:fadeUp 0.7s ease both;
  }

  .card::before{
    content:"";
    position:absolute;
    top:-60%;
    left:-20%;
    width:140%;
    height:140%;
    background:conic-gradient(from 0deg, transparent, rgba(198,255,30,0.08), transparent 30%);
    animation:rotate 12s linear infinite;
    pointer-events:none;
  }

  @keyframes rotate{
    to{ transform:rotate(360deg); }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .logo-badge{
    position:relative;
    z-index:1;
    width:100%;
    max-width:260px;
    margin:0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-badge img{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 0 18px rgba(198,255,30,0.35));
  }

  .name{
    position:relative;
    z-index:1;
    text-align:center;
    font-size:clamp(28px, 8vw, 36px);
    font-weight:800;
    letter-spacing:0.5px;
    margin:0;
    line-height:1.15;
    background:linear-gradient(90deg, #ffffff 0%, var(--lime) 55%, var(--lime-soft) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(198,255,30,0.35);
    filter:drop-shadow(0 0 12px rgba(198,255,30,0.25));
  }

  .role{
    position:relative;
    z-index:1;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
    margin:10px auto 26px;
    max-width:300px;
  }

  .role b{
    color:var(--lime);
    font-weight:600;
  }

  .divider{
    position:relative;
    z-index:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
    margin:0 0 24px;
  }

  .contacts{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
  }

  .contact-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--border);
    border-radius:12px;
    text-decoration:none;
    color:var(--text);
    transition:border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;
  }

  .contact-row:hover{
    border-color:rgba(198,255,30,0.4);
    background:rgba(198,255,30,0.04);
    transform:translateX(2px);
  }

  .contact-row svg{
    flex:0 0 auto;
    width:18px;
    height:18px;
    color:var(--lime);
  }

  .contact-text{
    display:flex;
    flex-direction:column;
    gap:1px;
    overflow:hidden;
  }

  .contact-label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .contact-value{
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .socials{
    position:relative;
    z-index:1;
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
  }

  .social-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    color:var(--text);
    text-decoration:none;
    transition:all 0.25s ease;
  }

  .social-btn svg{
    width:22px;
    height:22px;
    transition:transform 0.25s ease;
  }

  .social-btn:hover{
    background:var(--lime);
    border-color:var(--lime);
    color:#0a0a0a;
    box-shadow:0 0 24px rgba(198,255,30,0.5);
    transform:translateY(-3px);
  }

  .social-btn:hover svg{
    transform:scale(1.1);
  }

  .cta{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg, var(--lime) 0%, var(--lime-soft) 100%);
    color:#0a0a0a;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 8px 24px rgba(198,255,30,0.25);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cta svg{
    width:20px;
    height:20px;
  }

  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(198,255,30,0.4);
  }

  .cta:active{
    transform:translateY(0);
  }

  .footer-note{
    position:relative;
    z-index:1;
    text-align:center;
    margin-top:18px;
    font-size:11px;
    color:#555;
    letter-spacing:0.3px;
  }

  @media (max-width:480px){
    .card{
      padding:32px 20px 24px;
      border-radius:20px;
    }
    .social-btn{
      width:44px;
      height:44px;
    }
  }
</style>
</head>
